# main-এ push করলে: টেস্ট চলবে, সব পাস করলে Cloudflare-এ লাইভ হবে
# (CLOUDFLARE_API_TOKEN secret না থাকলে শুধু টেস্ট চলবে)
name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    env:
      RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # secret-এ ভুল করে ফাঁকা লাইন/দুবার পেস্ট হলেও প্রথম টোকেনটাই নেওয়া
      - name: টোকেন প্রস্তুত
        run: |
          T=$(printf '%s\n' "$RAW_CF_TOKEN" | awk 'NF{print $1; exit}')
          if [ -n "$T" ]; then echo "::add-mask::$T"; echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: দোকানের ছবির R2 (bucket, img ডোমেইন) — না থাকলে R2 ছাড়াই ডিপ্লয়
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/ensure-r2.mjs

      - name: ডাটাবেস migrate + Cloudflare-এ ডিপ্লয়
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy

      - name: Worker-এ CF_API_TOKEN secret (দোকানদারের নিজের ডোমেইন ফিচারের জন্য)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: echo "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CF_API_TOKEN

      - name: মূল ডোমেইনের DNS (sellxbd.com আর *.sellxbd.com → Worker), না থাকলে তৈরি
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/ensure-dns.mjs
